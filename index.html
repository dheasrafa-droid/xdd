<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSRT - Digital Smart Revise Technology</title>
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
    }
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #0f2027, #203a43, #2c5364);
      font-family: 'Arial', sans-serif;
      overflow: hidden;
    }

    /* Background parallax */
    .parallax {
      position: absolute;
      width: 200%;
      height: 200%;
      background: url('https://www.transparenttextures.com/patterns/cubes.png'); /* contoh pattern */
      opacity: 0.08;
      animation: moveBg 20s linear infinite;
    }

    @keyframes moveBg {
      from { transform: translate(0,0); }
      to { transform: translate(-200px,-200px); }
    }

    .hero {
      color: white;
      text-align: center;
      transform-style: preserve-3d;
      perspective: 1000px;
      transition: transform 0.1s ease-out;
      z-index: 2;
    }
    .hero h1 {
      font-size: 4rem;
      font-weight: bold;
      text-shadow: 0 5px 20px rgba(0,0,0,0.6);
    }
    .hero p {
      font-size: 1.2rem;
      margin-top: 10px;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="parallax"></div>

  <div class="hero" id="hero">
    <h1>DSRT</h1>
    <p>Digital Smart Revise Technology</p>
  </div>

  <script>
    const hero = document.getElementById("hero");
    document.addEventListener("mousemove", (e) => {
      let x = (window.innerWidth / 2 - e.pageX) / 25;
      let y = (window.innerHeight / 2 - e.pageY) / 25;
      hero.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
    });
    document.addEventListener("mouseleave", () => {
      hero.style.transform = "rotateY(0deg) rotateX(0deg)";
    });
  </script>
</body>
</html>
